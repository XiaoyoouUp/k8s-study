<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="860" height="420" fill="#ffffff" rx="12"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7b8ca0"/></marker></defs>

  <text x="430" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2e">kube-scheduler 两阶段调度</text>

  <rect x="60" y="60" width="170" height="54" rx="8" fill="#326CE5"/>
  <text x="145" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">待调度 Pod 队列</text>

  <rect x="290" y="50" width="240" height="76" rx="8" fill="#f5f8fc" stroke="#326CE5"/>
  <text x="410" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4aa8">第一阶段：过滤（Filter）</text>
  <text x="410" y="98" text-anchor="middle" font-size="11" fill="#46586b">硬性条件不满足即淘汰：</text>
  <text x="410" y="116" text-anchor="middle" font-size="11" fill="#46586b">资源不够 / 污点不兼容 / 不满足亲和</text>

  <rect x="590" y="50" width="220" height="76" rx="8" fill="#f5f8fc" stroke="#148a5c"/>
  <text x="700" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#148a5c">第二阶段：打分（Score）</text>
  <text x="700" y="98" text-anchor="middle" font-size="11" fill="#46586b">软性偏好逐项打分：</text>
  <text x="700" y="116" text-anchor="middle" font-size="11" fill="#46586b">资源均衡 / 镜像已存在 / 亲和加权</text>

  <rect x="640" y="190" width="170" height="54" rx="8" fill="#148a5c"/>
  <text x="725" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">绑定最高分节点</text>

  <line x1="230" y1="87" x2="286" y2="87" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="530" y1="87" x2="586" y2="87" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="800" y1="126" x2="760" y2="186" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="60" y="160" width="500" height="230" rx="10" fill="#f5f8fc" stroke="#a15c00" stroke-dasharray="5 4"/>
  <text x="310" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#a15c00">影响调度的"旋钮"（CKA 高频）</text>
  <text x="90" y="222" font-size="12" fill="#1c2733">① nodeSelector：<tspan fill="#7b8ca0" font-size="11">按标签选节点（简单版亲和）</tspan></text>
  <text x="90" y="250" font-size="12" fill="#1c2733">② nodeAffinity：<tspan fill="#7b8ca0" font-size="11">requiredDuringScheduling（硬）/ preferred（软）+ In/NotIn/Exists</tspan></text>
  <text x="90" y="278" font-size="12" fill="#1c2733">③ 污点 taint（节点）与容忍 toleration（Pod）配对：</text>
  <text x="120" y="300" font-size="11" fill="#46586b">NoSchedule 不调度 · PreferNoSchedule 尽量 · NoExecute 还会驱逐已在 Pod</text>
  <text x="90" y="330" font-size="12" fill="#1c2733">④ cordon/drain：<tspan fill="#7b8ca0" font-size="11">维护场景，节点会自动打上不可调度污点</tspan></text>
  <text x="90" y="358" font-size="12" fill="#1c2733">⑤ topologySpreadConstraints：<tspan fill="#7b8ca0" font-size="11">跨可用区/节点均匀分布</tspan></text>

  <text x="660" y="300" text-anchor="middle" font-size="11" fill="#7b8ca0">Pod 卡在 Pending？</text>
  <text x="660" y="320" text-anchor="middle" font-size="11" fill="#7b8ca0">kubectl describe pod 看</text>
  <text x="660" y="338" text-anchor="middle" font-size="11" fill="#7b8ca0">FailedScheduling 事件</text>
</svg>
