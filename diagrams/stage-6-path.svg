<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7b8ca0"/>
    </marker>
  </defs>
  <rect width="860" height="430" fill="#ffffff"/>
  <text x="30" y="36" font-size="15" font-weight="bold" fill="#0d1b2e">学习路径：本站六阶段 → CKA / CKAD / CKS</text>

  <!-- 六个阶段 -->
  <rect x="45" y="70" width="120" height="44" rx="8" fill="#E8F0FE" stroke="#326CE5" stroke-width="1.5"/>
  <text x="105" y="97" font-size="13" fill="#0d1b2e" text-anchor="middle">一 · 基础入门</text>
  <rect x="175" y="70" width="120" height="44" rx="8" fill="#E8F0FE" stroke="#326CE5" stroke-width="1.5"/>
  <text x="235" y="97" font-size="13" fill="#0d1b2e" text-anchor="middle">二 · 工作负载</text>
  <rect x="305" y="70" width="120" height="44" rx="8" fill="#E8F0FE" stroke="#326CE5" stroke-width="1.5"/>
  <text x="365" y="97" font-size="13" fill="#0d1b2e" text-anchor="middle">三 · 服务与网络</text>
  <rect x="435" y="70" width="120" height="44" rx="8" fill="#E8F0FE" stroke="#326CE5" stroke-width="1.5"/>
  <text x="495" y="97" font-size="13" fill="#0d1b2e" text-anchor="middle">四 · 存储与配置</text>
  <rect x="565" y="70" width="120" height="44" rx="8" fill="#E8F0FE" stroke="#326CE5" stroke-width="1.5"/>
  <text x="625" y="97" font-size="13" fill="#0d1b2e" text-anchor="middle">五 · 运维与安全</text>
  <rect x="695" y="70" width="120" height="44" rx="8" fill="#326CE5"/>
  <text x="755" y="97" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">六 · 认证冲刺</text>

  <line x1="165" y1="92" x2="172" y2="92" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="295" y1="92" x2="302" y2="92" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="425" y1="92" x2="432" y2="92" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="555" y1="92" x2="562" y2="92" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="685" y1="92" x2="692" y2="92" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 汇聚箭头 -->
  <line x1="430" y1="118" x2="430" y2="158" stroke="#7b8ca0" stroke-width="1.5"/>
  <line x1="160" y1="160" x2="700" y2="160" stroke="#7b8ca0" stroke-width="1.5"/>
  <line x1="160" y1="160" x2="160" y2="218" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="160" x2="430" y2="218" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="160" x2="700" y2="218" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 三张证书 -->
  <rect x="45" y="225" width="230" height="110" rx="10" fill="#326CE5"/>
  <text x="160" y="257" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">CKA · 管理员</text>
  <text x="160" y="283" font-size="12" fill="#dbe7fb" text-anchor="middle">架构 25% · 排障 30%</text>
  <text x="160" y="307" font-size="12" fill="#dbe7fb" text-anchor="middle">运维岗刚需，建议首考</text>

  <rect x="315" y="225" width="230" height="110" rx="10" fill="#148a5c"/>
  <text x="430" y="257" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">CKAD · 开发者</text>
  <text x="430" y="283" font-size="12" fill="#d8f2e6" text-anchor="middle">配置与安全 25%</text>
  <text x="430" y="307" font-size="12" fill="#d8f2e6" text-anchor="middle">偏应用构建、部署与观测</text>

  <rect x="585" y="225" width="230" height="110" rx="10" fill="#c53030"/>
  <text x="700" y="257" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">CKS · 安全专家</text>
  <text x="700" y="283" font-size="12" fill="#f7d9d9" text-anchor="middle">三域各 20% · 及格 67%</text>
  <text x="700" y="307" font-size="12" fill="#f7d9d9" text-anchor="middle">前置：持有有效 CKA</text>

  <text x="430" y="392" font-size="13" fill="#0d1b2e" text-anchor="middle">建议顺序：学完本站六阶段考 CKA → 再按职业方向考 CKAD 或 CKS</text>
  <text x="430" y="416" font-size="11" fill="#7b8ca0" text-anchor="middle">考纲权重随 Kubernetes 版本滚动更新，以 cncf.io 官方页面为准</text>
</svg>
