<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="30" y="40" font-size="15" font-weight="bold" fill="#0d1b2e">CKA 考纲五大域权重（基于 Kubernetes v1.32 考纲，2025-02 更新）</text>

  <!-- 排障 30% -->
  <text x="30" y="99" font-size="13" fill="#0d1b2e">排障 Troubleshooting</text>
  <rect x="270" y="80" width="390" height="28" rx="4" fill="#E8F0FE"/>
  <rect x="270" y="80" width="390" height="28" rx="4" fill="#326CE5"/>
  <text x="672" y="99" font-size="13" font-weight="bold" fill="#0d1b2e">30%</text>

  <!-- 集群架构 25% -->
  <text x="30" y="159" font-size="13" fill="#0d1b2e">集群架构、安装与配置</text>
  <rect x="270" y="140" width="390" height="28" rx="4" fill="#E8F0FE"/>
  <rect x="270" y="140" width="325" height="28" rx="4" fill="#326CE5"/>
  <text x="607" y="159" font-size="13" font-weight="bold" fill="#0d1b2e">25%</text>

  <!-- 服务与网络 20% -->
  <text x="30" y="219" font-size="13" fill="#0d1b2e">服务与网络</text>
  <rect x="270" y="200" width="390" height="28" rx="4" fill="#E8F0FE"/>
  <rect x="270" y="200" width="260" height="28" rx="4" fill="#326CE5"/>
  <text x="542" y="219" font-size="13" font-weight="bold" fill="#0d1b2e">20%</text>

  <!-- 工作负载与调度 15% -->
  <text x="30" y="279" font-size="13" fill="#0d1b2e">工作负载与调度</text>
  <rect x="270" y="260" width="390" height="28" rx="4" fill="#E8F0FE"/>
  <rect x="270" y="260" width="195" height="28" rx="4" fill="#326CE5"/>
  <text x="477" y="279" font-size="13" font-weight="bold" fill="#0d1b2e">15%</text>

  <!-- 存储 10% -->
  <text x="30" y="339" font-size="13" fill="#0d1b2e">存储</text>
  <rect x="270" y="320" width="390" height="28" rx="4" fill="#E8F0FE"/>
  <rect x="270" y="320" width="130" height="28" rx="4" fill="#326CE5"/>
  <text x="412" y="339" font-size="13" font-weight="bold" fill="#0d1b2e">10%</text>

  <!-- 信息块 -->
  <rect x="40" y="368" width="240" height="36" rx="6" fill="#E8F0FE" stroke="#326CE5"/>
