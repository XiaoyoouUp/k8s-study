  <rect x="310" y="368" width="240" height="36" rx="6" fill="#E8F0FE" stroke="#326CE5"/>
  <text x="430" y="391" font-size="13" fill="#0d1b2e" text-anchor="middle">及格线：66 分（百分制）</text>
  <rect x="580" y="368" width="240" height="36" rx="6" fill="#E8F0FE" stroke="#326CE5"/>
  <text x="700" y="391" font-size="13" fill="#0d1b2e" text-anchor="middle">$445 · 含 1 次重考</text>

  <text x="830" y="418" font-size="11" fill="#7b8ca0" text-anchor="end">数据核实于 2026-09，权重与政策以 cncf.io 官方页面为准</text>
