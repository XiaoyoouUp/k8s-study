<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="860" height="360" fill="#ffffff" rx="12"/>

  <text x="430" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2e">QoS 三等级：资源声明越完整，越不容易被牺牲</text>

  <rect x="50" y="64" width="220" height="190" rx="8" fill="#E8F0FE" stroke="#148a5c"/>
  <text x="160" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#148a5c">Guaranteed（有保障）</text>
  <text x="160" y="126" text-anchor="middle" font-size="12" fill="#46586b">每个容器都声明 CPU 与内存</text>
  <text x="160" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d1b2e">requests == limits</text>
  <text x="160" y="174" text-anchor="middle" font-size="12" fill="#46586b">资源紧张时最后被驱逐</text>
  <text x="160" y="204" text-anchor="middle" font-size="11" fill="#148a5c">生产核心服务首选</text>

  <rect x="320" y="64" width="220" height="190" rx="8" fill="#ffffff" stroke="#326CE5"/>
  <text x="430" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b4aa8">Burstable（突发）</text>
  <text x="430" y="126" text-anchor="middle" font-size="12" fill="#46586b">至少设置了一部分 requests/limits</text>
  <text x="430" y="148" text-anchor="middle" font-size="12" fill="#46586b">且不满足 requests == limits</text>
  <text x="430" y="174" text-anchor="middle" font-size="12" fill="#46586b">实际用量超 requests 越多越危险</text>
  <text x="430" y="204" text-anchor="middle" font-size="11" fill="#1b4aa8">Kubernetes 默认形态</text>

  <rect x="590" y="64" width="220" height="190" rx="8" fill="#ffffff" stroke="#c53030"/>
  <text x="700" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#c53030">BestEffort（尽力而为）</text>
  <text x="700" y="126" text-anchor="middle" font-size="12" fill="#46586b">requests 与 limits 全都不设置</text>
  <text x="700" y="148" text-anchor="middle" font-size="12" fill="#46586b">调度时按 0 资源计算</text>
  <text x="700" y="174" text-anchor="middle" font-size="12" fill="#46586b">节点内存紧张时最先被杀</text>
  <text x="700" y="204" text-anchor="middle" font-size="11" fill="#c53030">仅限临时调试任务</text>

  <text x="430" y="312" text-anchor="middle" font-size="12" fill="#7b8ca0">节点资源压力下的驱逐优先级：BestEffort ＞ Burstable ＞ Guaranteed（QoS 由系统推导，不显示在任何命令输出中）</text>
</svg>
