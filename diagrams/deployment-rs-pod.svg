<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="860" height="400" fill="#ffffff" rx="12"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7b8ca0"/></marker></defs>

  <rect x="50" y="40" width="180" height="46" rx="8" fill="#326CE5"/>
  <text x="140" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Deployment web</text>

  <rect x="40" y="130" width="250" height="120" rx="8" fill="#f5f8fc" stroke="#7b8ca0" stroke-dasharray="4 3"/>
  <text x="165" y="152" text-anchor="middle" font-size="12" fill="#7b8ca0">旧 ReplicaSet rev.1（缩到 0）</text>
  <rect x="70" y="166" width="70" height="28" rx="5" fill="#eef2f7" stroke="#7b8ca0"/>
  <text x="105" y="185" text-anchor="middle" font-size="11" fill="#7b8ca0">Pod</text>
  <rect x="160" y="166" width="70" height="28" rx="5" fill="#eef2f7" stroke="#7b8ca0"/>
  <text x="195" y="185" text-anchor="middle" font-size="11" fill="#7b8ca0">Pod</text>
  <text x="165" y="226" text-anchor="middle" font-size="11" fill="#7b8ca0">保留用于回滚</text>

  <rect x="330" y="130" width="250" height="120" rx="8" fill="#f5f8fc" stroke="#326CE5" stroke-dasharray="4 3"/>
  <text x="455" y="152" text-anchor="middle" font-size="12" fill="#1b4aa8">新 ReplicaSet rev.2（扩到 3）</text>
  <rect x="360" y="166" width="70" height="28" rx="5" fill="#E8F0FE" stroke="#326CE5"/>
  <text x="395" y="185" text-anchor="middle" font-size="11" fill="#1b4aa8">Pod v2</text>
  <rect x="450" y="166" width="70" height="28" rx="5" fill="#E8F0FE" stroke="#326CE5"/>
  <text x="485" y="185" text-anchor="middle" font-size="11" fill="#1b4aa8">Pod v2</text>
  <rect x="360" y="206" width="70" height="28" rx="5" fill="#E8F0FE" stroke="#326CE5"/>
  <text x="395" y="225" text-anchor="middle" font-size="11" fill="#1b4aa8">Pod v2</text>

  <line x1="140" y1="86" x2="120" y2="126" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="190" y1="86" x2="420" y2="126" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="455" y="278" text-anchor="middle" font-size="12" fill="#46586b">每次模板变更生成新 ReplicaSet，逐个替换 Pod</text>

  <text x="680" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d1b2e">滚动更新参数</text>
  <text x="680" y="180" text-anchor="middle" font-size="12" fill="#46586b">maxSurge: 允许多出的副本数</text>
  <text x="680" y="202" text-anchor="middle" font-size="12" fill="#46586b">maxUnavailable: 允许不可用的上限</text>
  <text x="680" y="224" text-anchor="middle" font-size="12" fill="#46586b">默认各 25%</text>
  <text x="680" y="252" text-anchor="middle" font-size="12" fill="#148a5c">更新期服务不中断</text>

  <text x="430" y="330" text-anchor="middle" font-size="12" fill="#7b8ca0">管理链：Deployment → ReplicaSet → Pod；回滚 = 切回旧 ReplicaSet（kubectl rollout undo）</text>
  <text x="430" y="356" text-anchor="middle" font-size="12" fill="#7b8ca0">归属性质：Pod 由 ReplicaSet 创建并持有 pod-template-hash 标签</text>
</svg>
