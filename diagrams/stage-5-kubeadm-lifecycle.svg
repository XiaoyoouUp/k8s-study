<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="860" height="400" fill="#ffffff" rx="12"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7b8ca0"/></marker></defs>

  <text x="430" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2e">kubeadm 集群生命周期：一条主线管到底</text>

  <rect x="30" y="70" width="142" height="120" rx="10" fill="#f5f8fc" stroke="#326CE5"/>
  <text x="101" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4aa8">① kubeadm init</text>
  <text x="101" y="122" text-anchor="middle" font-size="11" fill="#46586b">初始化控制平面</text>
  <text x="101" y="144" text-anchor="middle" font-size="11" fill="#7b8ca0">静态 Pod · 证书 · kubeconfig</text>

  <rect x="194" y="70" width="142" height="120" rx="10" fill="#f5f8fc" stroke="#326CE5"/>
  <text x="265" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4aa8">② kubeadm join</text>
  <text x="265" y="122" text-anchor="middle" font-size="11" fill="#46586b">节点加入集群</text>
  <text x="265" y="144" text-anchor="middle" font-size="11" fill="#7b8ca0">token（CP 加 certificate-key）</text>

  <rect x="358" y="70" width="142" height="120" rx="10" fill="#f5f8fc" stroke="#326CE5"/>
  <text x="429" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4aa8">③ 日常维护</text>
  <text x="429" y="122" text-anchor="middle" font-size="11" fill="#46586b">cordon / drain 腾空维护</text>
  <text x="429" y="144" text-anchor="middle" font-size="11" fill="#7b8ca0">token create / list</text>

  <rect x="522" y="70" width="142" height="120" rx="10" fill="#326CE5"/>
  <text x="593" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">④ kubeadm upgrade</text>
  <text x="593" y="122" text-anchor="middle" font-size="11" fill="#dbe7ff">一次升一个小版本</text>
  <text x="593" y="144" text-anchor="middle" font-size="11" fill="#dbe7ff">先 kubeadm 再 kubelet</text>

  <rect x="686" y="70" width="142" height="120" rx="10" fill="#e2f4ea" stroke="#148a5c"/>
  <text x="757" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#148a5c">⑤ kubeadm certs</text>
  <text x="757" y="122" text-anchor="middle" font-size="11" fill="#1c2733">证书巡检与续期</text>
  <text x="757" y="144" text-anchor="middle" font-size="11" fill="#7b8ca0">renew 后重启静态 Pod</text>

  <line x1="175" y1="130" x2="191" y2="130" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="339" y1="130" x2="355" y2="130" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="503" y1="130" x2="519" y2="130" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="667" y1="130" x2="683" y2="130" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="30" y="230" width="798" height="130" rx="10" fill="#E8F0FE" stroke="#326CE5"/>
  <text x="50" y="258" font-size="13" font-weight="bold" fill="#1b4aa8">init 在控制平面节点留下的"运维地图"</text>
  <text x="50" y="286" font-size="12" fill="#1c2733">/etc/kubernetes/manifests/  静态 Pod 清单：etcd、apiserver 等，改文件即改配置、删文件即停组件</text>
  <text x="50" y="310" font-size="12" fill="#1c2733">/etc/kubernetes/pki/       全部证书与私钥，默认有效期 1 年</text>
  <text x="50" y="334" font-size="12" fill="#1c2733">/etc/kubernetes/*.conf     admin.conf 等 kubeconfig，kubectl 连接集群的"钥匙"</text>
</svg>
