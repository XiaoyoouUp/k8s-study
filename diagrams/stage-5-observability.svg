<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="860" height="400" fill="#ffffff" rx="12"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7b8ca0"/></marker></defs>

  <text x="430" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2e">排障取证三入口：指标 · 日志 · 事件</text>

  <rect x="310" y="52" width="240" height="44" rx="8" fill="#0d1b2e"/>
  <text x="430" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">线上异常：先取证，再动手</text>

  <rect x="40" y="150" width="240" height="160" rx="10" fill="#f5f8fc" stroke="#326CE5"/>
  <text x="160" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4aa8">指标 metrics-server</text>
  <text x="160" y="204" text-anchor="middle" font-size="11" fill="#46586b">kubectl top nodes / pods</text>
  <text x="160" y="226" text-anchor="middle" font-size="11" fill="#46586b">回答：资源水位有多高</text>
  <text x="160" y="248" text-anchor="middle" font-size="11" fill="#7b8ca0">top 不可用 → 检查该插件</text>
  <text x="160" y="270" text-anchor="middle" font-size="11" fill="#7b8ca0">瞬时值，看趋势用监控系统</text>

  <rect x="310" y="150" width="240" height="160" rx="10" fill="#f5f8fc" stroke="#326CE5"/>
  <text x="430" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4aa8">日志 logs</text>
  <text x="430" y="204" text-anchor="middle" font-size="11" fill="#46586b">kubectl logs -f --tail -p</text>
  <text x="430" y="226" text-anchor="middle" font-size="11" fill="#46586b">节点侧：/var/log/pods</text>
  <text x="430" y="248" text-anchor="middle" font-size="11" fill="#46586b">kubelet：journalctl -u kubelet</text>
  <text x="430" y="270" text-anchor="middle" font-size="11" fill="#7b8ca0">-p 看上一个崩溃实例</text>

  <rect x="580" y="150" width="240" height="160" rx="10" fill="#f5f8fc" stroke="#326CE5"/>
  <text x="700" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4aa8">事件 events</text>
  <text x="700" y="204" text-anchor="middle" font-size="11" fill="#46586b">kubectl get events</text>
  <text x="700" y="226" text-anchor="middle" font-size="11" fill="#46586b">--sort-by=.lastTimestamp</text>
  <text x="700" y="248" text-anchor="middle" font-size="11" fill="#46586b">describe 底部自动附带</text>
  <text x="700" y="270" text-anchor="middle" font-size="11" fill="#c53030">默认约 1 小时过期，尽快取证</text>

  <line x1="390" y1="96" x2="180" y2="146" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="430" y1="96" x2="430" y2="146" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="470" y1="96" x2="680" y2="146" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="30" y="340" width="810" height="40" rx="8" fill="#E8F0FE" stroke="#326CE5"/>
  <text x="435" y="365" text-anchor="middle" font-size="12" fill="#1c2733">审计日志 audit：apiserver 按 AuditPolicy 记录"谁在何时对什么资源做了什么"——安全合规视角，CKA 只考概念</text>
</svg>
