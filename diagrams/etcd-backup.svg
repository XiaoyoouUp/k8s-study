<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="860" height="380" fill="#ffffff" rx="12"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7b8ca0"/></marker></defs>

  <text x="430" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2e">etcd 备份与恢复（CKA 必考）</text>

  <rect x="50" y="60" width="220" height="110" rx="10" fill="#f5f8fc" stroke="#326CE5"/>
  <text x="160" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4aa8">控制平面节点</text>
  <text x="160" y="108" text-anchor="middle" font-size="11" fill="#46586b">etcd 以静态 Pod 运行</text>
  <text x="160" y="126" text-anchor="middle" font-size="11" fill="#7b8ca0">数据目录 /var/lib/etcd</text>
  <text x="160" y="144" text-anchor="middle" font-size="11" fill="#7b8ca0">证书在 /etc/kubernetes/pki/etcd</text>

  <rect x="360" y="70" width="220" height="90" rx="10" fill="#326CE5"/>
  <text x="470" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">etcdctl snapshot save</text>
  <text x="470" y="120" text-anchor="middle" font-size="11" fill="#dbe7ff">--endpoints / --cacert</text>
  <text x="470" y="138" text-anchor="middle" font-size="11" fill="#dbe7ff">--cert / --key（从清单抄）</text>

  <rect x="670" y="80" width="150" height="70" rx="10" fill="#0d1b2e"/>
  <text x="745" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">快照文件</text>
  <text x="745" y="128" text-anchor="middle" font-size="11" fill="#9db8e6">/backup/etcd.db</text>

  <line x1="270" y1="115" x2="356" y2="115" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="580" y1="115" x2="666" y2="115" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="60" y="220" width="740" height="120" rx="10" fill="#fdf1e0" stroke="#a15c00"/>
  <text x="430" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#a15c00">恢复四步（restore 生成新数据目录，再让 etcd 指向它）</text>
  <text x="80" y="276" font-size="12" fill="#1c2733">① 停 kube-apiserver（移走静态 Pod 清单）</text>
  <text x="80" y="300" font-size="12" fill="#1c2733">② etcdctl snapshot restore /backup/etcd.db --data-dir=/var/lib/etcd-restored</text>
  <text x="80" y="324" font-size="12" fill="#1c2733">③ 修改 etcd 静态 Pod 清单，把数据卷指向新目录，kubelet 自动重建 etcd</text>
  <text x="430" y="324" font-size="12" fill="#1c2733"></text>
  <text x="80" y="344" font-size="12" fill="#1c2733">④ 恢复 apiserver 静态 Pod 清单，验证 kubectl get nodes / pods</text>

  <text x="430" y="368" text-anchor="middle" font-size="11" fill="#7b8ca0">快照包含全部集群对象（不含 PV 数据本身）；定期用 CronJob 备份是生产实践</text>
</svg>
