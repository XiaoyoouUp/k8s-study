<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="860" height="360" fill="#ffffff" rx="12"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7b8ca0"/></marker></defs>

  <text x="430" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2e">一次 Service 转发的完整路径</text>

  <rect x="60" y="60" width="150" height="46" rx="8" fill="#E8F0FE" stroke="#326CE5"/>
  <text x="135" y="88" text-anchor="middle" font-size="13" fill="#1b4aa8">客户端 Pod</text>
  <text x="135" y="126" text-anchor="middle" font-size="11" fill="#46586b">访问 http://nginx-service</text>

  <rect x="70" y="160" width="270" height="52" rx="8" fill="#dbe7ff" stroke="#326CE5"/>
  <text x="205" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4aa8">CoreDNS 解析</text>
  <text x="205" y="200" text-anchor="middle" font-size="11" fill="#46586b">nginx-service.default.svc.cluster.local → 10.96.45.12</text>

  <rect x="400" y="60" width="180" height="46" rx="8" fill="#326CE5"/>
  <text x="490" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Service VIP</text>
  <text x="490" y="126" text-anchor="middle" font-size="11" fill="#7b8ca0">虚拟 IP，不绑定任何网卡</text>

  <rect x="360" y="160" width="260" height="52" rx="8" fill="#ffffff" stroke="#326CE5"/>
  <text x="490" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4aa8">kube-proxy 规则</text>
  <text x="490" y="200" text-anchor="middle" font-size="11" fill="#7b8ca0">iptables（默认）/ IPVS / eBPF</text>

  <rect x="420" y="248" width="140" height="40" rx="8" fill="#e2f4ea" stroke="#148a5c"/>
  <text x="490" y="273" text-anchor="middle" font-size="12" fill="#148a5c">EndpointSlice</text>

  <rect x="130" y="248" width="130" height="40" rx="8" fill="#E8F0FE" stroke="#326CE5"/>
  <text x="195" y="273" text-anchor="middle" font-size="12" fill="#1b4aa8">Pod 10.244.1.12</text>
  <rect x="290" y="248" width="120" height="40" rx="8" fill="#E8F0FE" stroke="#326CE5"/>
  <text x="350" y="273" text-anchor="middle" font-size="12" fill="#1b4aa8">Pod 10.244.2.7</text>
  <rect x="620" y="248" width="120" height="40" rx="8" fill="#E8F0FE" stroke="#326CE5"/>
  <text x="680" y="273" text-anchor="middle" font-size="12" fill="#1b4aa8">Pod 10.244.1.18</text>

  <line x1="210" y1="106" x2="205" y2="156" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="210" y1="106" x2="420" y2="90" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="490" y1="106" x2="490" y2="156" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="470" y1="212" x2="480" y2="244" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="450" y1="272" x2="414" y2="272" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="560" y1="272" x2="616" y2="272" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="430" y1="266" x2="264" y2="266" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="430" y="322" text-anchor="middle" font-size="12" fill="#7b8ca0">就绪探针失败的 Pod 不会进入 EndpointSlice —— Endpoints 为空是 Service 不通的第一排查点</text>
</svg>
