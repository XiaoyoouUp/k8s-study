<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="860" height="330" fill="#ffffff" rx="12"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7b8ca0"/></marker></defs>

  <rect x="50" y="60" width="170" height="60" rx="8" fill="#0d1b2e"/>
  <text x="135" y="86" text-anchor="middle" font-size="13" fill="#ffffff">用户提交清单</text>
  <text x="135" y="104" text-anchor="middle" font-size="11" fill="#9db8e6">spec：期望状态</text>

  <rect x="290" y="60" width="170" height="60" rx="8" fill="#326CE5"/>
  <text x="375" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">API Server</text>
  <text x="375" y="104" text-anchor="middle" font-size="11" fill="#dbe7ff">校验并存储对象</text>

  <rect x="530" y="60" width="150" height="60" rx="8" fill="#ffffff" stroke="#326CE5"/>
  <text x="605" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2733">etcd</text>
  <text x="605" y="104" text-anchor="middle" font-size="11" fill="#7b8ca0">对象 = spec + status</text>

  <line x1="220" y1="90" x2="286" y2="90" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="460" y1="90" x2="526" y2="90" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="160" y="180" width="540" height="110" rx="10" fill="#f5f8fc" stroke="#148a5c" stroke-dasharray="5 4"/>
  <text x="430" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#148a5c">控制循环（Controller Reconciliation Loop）</text>
  <text x="300" y="240" text-anchor="middle" font-size="13" fill="#1c2733">观察实际状态 status</text>
  <line x1="360" y1="235" x2="430" y2="235" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="490" y="240" text-anchor="middle" font-size="13" fill="#1c2733">对比期望 spec</text>
  <line x1="545" y1="235" x2="615" y2="235" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="430" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#c53030">有差异 → 执行动作（创建/删除/扩容）→ 循环</text>

  <text x="430" y="318" text-anchor="middle" font-size="12" fill="#7b8ca0">声明式：你只声明"要什么"，控制器持续把集群调成"要的样子"——这就是期望状态与实际状态的差值驱动</text>
</svg>
